[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plasticpaths-story-backend"
version = "0.1.0"
description = "Educational retrieval, storytelling, and narration backend for PlasticPaths"
requires-python = ">=3.11"
dependencies = [
  "elevenlabs>=2.0",
  "fastapi>=0.115,<1",
  "google-genai>=1.0",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "tidb-vector>=0.0.11,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
plasticpaths-seed-tidb = "app.seed:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
